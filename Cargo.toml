[workspace]
resolver = "3"
members = [
    "crates/cordial",
    "crates/cordial-model",
    "crates/cordial-http",
    "crates/cordial-gateway",
    "crates/cordial-cache",
    "crates/cordial-endpoint",
    "crates/cordial-voice",
    "crates/cordial-macros",
    "crates/cordial-framework",
    "xtask",
]
default-members = [
    "crates/cordial",
    "crates/cordial-model",
    "crates/cordial-http",
    "crates/cordial-gateway",
    "crates/cordial-cache",
    "crates/cordial-endpoint",
    "crates/cordial-voice",
    "crates/cordial-macros",
    "crates/cordial-framework",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
categories = ["api-bindings", "asynchronous"]
keywords = ["discord", "bot", "api", "gateway"]
authors = ["cordial contributors"]

# Internal crates. Keep each version equal to `workspace.package.version`.
[workspace.dependencies]
cordial-model = { path = "crates/cordial-model", version = "=0.0.1" }
cordial-http = { path = "crates/cordial-http", version = "=0.0.1" }
cordial-gateway = { path = "crates/cordial-gateway", version = "=0.0.1" }
cordial-cache = { path = "crates/cordial-cache", version = "=0.0.1" }
cordial-endpoint = { path = "crates/cordial-endpoint", version = "=0.0.1" }
cordial-voice = { path = "crates/cordial-voice", version = "=0.0.1" }
cordial-macros = { path = "crates/cordial-macros", version = "=0.0.1" }
cordial-framework = { path = "crates/cordial-framework", version = "=0.0.1" }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# A selected subset of `pedantic`. The full group gives too much noise.
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
# Safety and hygiene.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = "line-tables-only"
