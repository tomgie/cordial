[workspace]
resolver = "3"
members = [
    "crates/cordial",
    "crates/cordial-model",
    "crates/cordial-http",
    "crates/cordial-gateway",
    "crates/cordial-cache",
    "crates/cordial-endpoint",
    "crates/cordial-voice",
    "crates/cordial-macros",
    "crates/cordial-framework",
    "xtask",
]
default-members = [
    "crates/cordial",
    "crates/cordial-model",
    "crates/cordial-http",
    "crates/cordial-gateway",
    "crates/cordial-cache",
    "crates/cordial-endpoint",
    "crates/cordial-voice",
    "crates/cordial-macros",
    "crates/cordial-framework",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
categories = ["api-bindings", "asynchronous"]
keywords = ["discord", "bot", "api", "gateway"]
authors = ["cordial contributors"]

# Internal crates. Keep each version equal to `workspace.package.version`.
[workspace.dependencies]
cordial-model = { path = "crates/cordial-model", version = "=0.3.0" }
cordial-http = { path = "crates/cordial-http", version = "=0.3.0" }
cordial-gateway = { path = "crates/cordial-gateway", version = "=0.3.0" }
cordial-cache = { path = "crates/cordial-cache", version = "=0.3.0" }
cordial-endpoint = { path = "crates/cordial-endpoint", version = "=0.3.0" }
cordial-voice = { path = "crates/cordial-voice", version = "=0.3.0" }
cordial-macros = { path = "crates/cordial-macros", version = "=0.3.0" }
cordial-framework = { path = "crates/cordial-framework", version = "=0.3.0" }

# External crates.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
bytes = "1"
http = "1"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["http2"] }
thiserror = "2"
tokio = { version = "1.47", default-features = false }
tracing = "0.1"
zeroize = "1"
dashmap = "6"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
ed25519-dalek = "3"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
zstd = { version = "0.14", default-features = false }
# DAVE end-to-end encryption.
openmls = "0.9.2"
openmls_rust_crypto = "0.6"
openmls_basic_credential = "0.6"
aes-gcm = "0.10"
hmac = "0.13"
sha2 = "0.11"
subtle = "2.6"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# A selected subset of `pedantic`. The full group gives too much noise.
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
# Safety and hygiene.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = "line-tables-only"
