[package]
name = "cordial"
description = "A full-featured library for Discord bots: HTTP, gateway, cache, interactions, and voice."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
authors.workspace = true

[features]
default = ["http", "gateway", "cache", "framework", "macros"]
http = ["dep:cordial-http"]
gateway = ["http", "dep:cordial-gateway"]
cache = ["dep:cordial-cache"]
framework = ["http", "gateway", "cache", "dep:cordial-framework"]
macros = ["dep:cordial-macros"]
endpoint = ["dep:cordial-endpoint", "cordial-framework?/endpoint"]
# An `axum` router for the endpoint.
axum = ["endpoint", "cordial-endpoint/axum"]
voice = ["gateway", "dep:cordial-voice", "cordial-framework?/voice"]
# Opus encode and decode with libopus (needs CMake and a C compiler). Needed to send PCM.
opus = ["voice", "cordial-voice/opus"]
# Decode MP3, FLAC, WAV, Vorbis, and AAC files.
symphonia = ["voice", "cordial-voice/symphonia"]

[dependencies]
cordial-model.workspace = true
cordial-http = { workspace = true, optional = true }
cordial-gateway = { workspace = true, optional = true }
cordial-cache = { workspace = true, optional = true }
cordial-endpoint = { workspace = true, optional = true }
cordial-voice = { workspace = true, optional = true }
cordial-macros = { workspace = true, optional = true }
cordial-framework = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "net"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true

[[example]]
name = "http_interactions"
required-features = ["axum"]

[[example]]
name = "live_voice"
required-features = ["opus"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
